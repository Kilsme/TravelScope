<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>try{var p=JSON.parse(localStorage.getItem('travelscope:appearance:v1')||'{}');document.documentElement.dataset.theme=p&&p.theme==='dark'?'dark':'light';document.documentElement.lang=p&&p.locale==='en'?'en':'zh-CN';if(p&&p.locale==='en')document.title='TravelScope Travel Assistant'}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>TravelScope 智能旅游助手</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
