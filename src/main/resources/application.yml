## ============================================================================
## TravelScope - 智能旅游助手 主配置文件
## ============================================================================

spring:
  application:
    name: TravelScope

  # ======================== 数据源配置（PostgreSQL） ========================
  datasource:
    url: jdbc:postgresql://localhost:5432/travelscope?stringtype=unspecified&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ======================== JPA / Hibernate 配置 ========================
  jpa:
    hibernate:
      ddl-auto: none  # 使用 SQL 脚本手动建表
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true

  # ======================== Redis 配置 ========================
  data:
    redis:
      host: localhost
      port: 6379
      password: root123456
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000

  # ======================== 文件上传配置 ========================
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ======================== 服务端口配置 ========================
server:
  port: 8080
  servlet:
    context-path: /api

# ======================== 应用统一配置 ========================
## 所有第三方 API Key 通过环境变量 / 高级设置注入，不在配置文件中硬编码
travelscope:
  # ---- 通义千问（DashScope）模型配置 ----
  dashscope:
    api-key: ${API_KEY:}
    model: qwen-plus
    embedding-model: text-embedding-v3
    embedding-dimensions: 1024

  # ---- 高德地图 API 配置 ----
  amap:
    web-api-key: ${AMAP_WEB_API_KEY:}
    base-url: https://restapi.amap.com/v3

  # ---- 和风天气 API 配置 ----
  weather:
    # 和风天气 API Host，不含 https:// 前缀，如 devapi.qweather.com 或 xxx.re.qweatherapi.com
    api-host: ${WEATHER_API_HOST:}
    api-key: ${WEATHER_API_KEY:}

  # ---- MinIO 对象存储配置 ----
  minio:
    endpoint: http://localhost:9000
    access-key: root
    secret-key: root123456
    bucket-name: travelscope-docs

  # ---- AgentScope 配置 ----
  agentscope:
    workspace-path: .agentscope/workspace
    vector-store-table: document_chunks
    embedding-dimensions: 1024

  # ---- Elasticsearch 配置 ----
  # 用于 RAG 全文检索（BM25），与 pgvector 向量检索组成双路检索
  elasticsearch:
    # ES 服务地址
    url: http://localhost:9200
    # 索引名称（文档块全文索引）
    index-name: document_chunks_fulltext
    # 向量维度（与 pgvector 保持一致）
    dimensions: 1024
    # 用户名（开发环境未启用安全认证，留空）
    username: ""
    # 密码（开发环境未启用安全认证，留空）
    password: ""
    # 是否禁用 SSL 验证（开发环境用）
    disable-ssl-verification: false

  # ---- RAG 双路检索配置 ----
  rag:
    # 检索模式: dual - 双路检索 / vector - 仅向量 / fulltext - 仅全文
    mode: dual
    # 向量检索权重（0~1，双路融合时使用）
    vector-weight: 0.7
    # 全文检索权重（0~1，双路融合时使用）
    fulltext-weight: 0.3
    # 返回结果数量
    top-k: 5
    # 融合算法: rrf - Reciprocal Rank Fusion / weighted - 加权分数
    fusion: rrf
    # RRF 参数（仅当 fusion=rrf 时生效）
    rrf-k: 60

# ======================== 日志配置 ========================
logging:
  level:
    root: INFO
    com.travelscope: DEBUG
    io.agentscope: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/travelscope.log
    max-size: 50MB
    max-history: 30

# ======================== Actuator 端点配置 ========================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env
  endpoint:
    health:
      show-details: always
