## ============================================================================
## TravelScope - 智能旅游助手 主配置文件
## ============================================================================

spring:
  application:
    name: TravelScope

  # ======================== 数据源配置（PostgreSQL） ========================
  datasource:
    url: jdbc:postgresql://localhost:5432/travelscope?stringtype=unspecified&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      # 2026-09-23 并发改造：20 → 30（2000 在线 / 峰值并发对话的入库写放大；
      # SSE 长连接不占连接，30 是 8C16G + PG 默认 max_connections=100 的安全值）
      maximum-pool-size: 30
      minimum-idle: 5
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # ======================== JPA / Hibernate 配置 ========================
  jpa:
    hibernate:
      ddl-auto: none  # 使用 SQL 脚本手动建表
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true

  # ======================== Redis 配置 ========================
  data:
    redis:
      host: localhost
      port: 6379
      password: root123456
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000

  # ======================== 文件上传配置 ========================
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ======================== 服务端口配置 ========================
server:
  port: 8080
  servlet:
    context-path: /api
  # 2026-09-23 并发改造：显式声明（与默认一致，防 Spring Boot 升级漂移）——
  # 2000 SSE 长连接在 max-connections 内；线程 200 承载 Tomcat 侧请求调度
  tomcat:
    threads:
      max: 200
    max-connections: 8192
    accept-count: 100

# ======================== 应用统一配置 ========================
## 所有第三方 API Key 通过环境变量 / 高级设置注入，不在配置文件中硬编码
travelscope:
  # ---- 模型网关（OpenAI 兼容）：全部对话模型经此网关（2026-10-05 迁移）----
  # 主链路与质检 = glm-5-3-260814；轻量档（L2 分类/摘要/fallback）= deepseek-v4-flash-0731
  # （见 intent-cascade.l2-model 与 chat-history.summary.model）
  # 轻量档用 -0731 变体的原因：网关上 deepseek-v4-flash 渠道损坏（实测 500
  # do_request_failed，-w8a8-400k 同坏；-0731 与 v4.1-flash 可用）——网关修复后
  # 改回 deepseek-v4-flash 只需调整下方两处模型名配置
  model-gateway:
    base-url: http://ddns.trdyun.xyz:10003/v1
    api-key: ${media_model_gateway_api_key:}
    # 主链路对话模型（master/planner/intake/poi/route + L3 意图分类兜底）
    model: glm-5-3-260814
    # 质检评分模型（FR-S08：reviewer-agent + EvalCase Rubric 评分专用）
    reviewer-model: glm-5-3-260814
    # GLM 思考模式：GLM-5 系默认开启（单轮推理实测 35~133s，420s 链路预算内跑不完整链），
    # 禁用后单轮 ~2s——默认禁用；需要评审深度时可临时打开（链路耗时会同量级放大）
    thinking-enabled: false
    # 结构化输出兼容开关（2026-10-05 实测校准）：
    # glm-5-3-260814 不严格遵守 json_schema response_format（实测返回 markdown 围栏
    # JSON + 附加文字，_structured_output 解析失败）——置 false 走合成
    # generate_response 工具路径（glm 工具调用已被 B1 验收验证可靠）；
    # native-structured-output-with-tools 保留 true（当前无「工具+结构化」并存的调用方）
    native-structured-output: false
    native-structured-output-with-tools: true

  # ---- 通义千问（DashScope）：仅 Embedding（text-embedding-v3）使用 ----
  dashscope:
    api-key: ${API_KEY:}
    embedding-model: text-embedding-v3
    embedding-dimensions: 1024

  # ---- 高德地图 API 配置 ----
  amap:
    web-api-key: ${AMAP_WEB_API_KEY:}
    base-url: https://restapi.amap.com/v3

  # ---- 和风天气 API 配置 ----
  weather:
    # 和风天气 API Host，不含 https:// 前缀，如 devapi.qweather.com 或 xxx.re.qweatherapi.com
    api-host: ${WEATHER_API_HOST:}
    api-key: ${WEATHER_API_KEY:}

  # ---- MinIO 对象存储配置 ----
  minio:
    endpoint: http://localhost:9000
    access-key: root
    secret-key: root123456
    bucket-name: travelscope-docs

  # ---- AgentScope 配置 ----
  agentscope:
    workspace-path: .agentscope/workspace
    vector-store-table: document_chunks
    embedding-dimensions: 1024

  # ---- Elasticsearch 配置 ----
  # 用于 RAG 全文检索（BM25），与 pgvector 向量检索组成双路检索
  elasticsearch:
    # ES 服务地址
    url: http://localhost:9200
    # 索引名称（文档块全文索引）
    index-name: document_chunks_fulltext
    # 向量维度（与 pgvector 保持一致）
    dimensions: 1024
    # HTTP 超时（2026-10-11 P1-D）：连接 3s；读取 10s——小于 RAG 通道级超时
    # （rag.lane-timeout-ms 15s），HTTP 层先超时让慢查询任务终结释放线程，lane 层再兜底
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    # 用户名（开发环境未启用安全认证，留空）
    username: ""
    # 密码（开发环境未启用安全认证，留空）
    password: ""
    # 是否禁用 SSL 验证（开发环境用）
    disable-ssl-verification: false

  # ---- RAG 双路检索配置 ----
  rag:
    # 检索模式: dual - 双路检索 / vector - 仅向量 / fulltext - 仅全文
    mode: dual
    # 向量检索权重（0~1，双路融合时使用）
    vector-weight: 0.7
    # 全文检索权重（0~1，双路融合时使用）
    fulltext-weight: 0.3
    # 融合后进上下文的最终条数（2026-10-11 P1-E：原 top-k，与召回扇出拆分）
    context-top-k: 5
    # 每路召回扇出（想大保召回）；不变式 recall-fanout ≥ context-top-k，违反启动报错
    recall-fanout: 15
    # 融合算法: rrf - Reciprocal Rank Fusion / weighted - 加权分数
    fusion: rrf
    # RRF 参数（仅当 fusion=rrf 时生效）
    rrf-k: 60
    # 双路检索通道级超时（2026-10-11 P1-C 并行化）：每路独立计时，超时路按空结果降级——
    # 只放弃等待不中断任务；15s 起步（过小等于整路白算）
    lane-timeout-ms: 15000
    # 证据门控（2026-10-11 清单 4.4 完整形态）：融合后按绝对相关性（pgvector 余弦相似度）
    # 丢弃低于阈值的片段；全灭时工具层输出「无相关证据」而非装配噪声喂给 agent
    evidence-gate-enabled: true
    # 阈值=相似度下限（COSINE：score=1-余弦距离，实际值域约 [0,1]）；校准见
    # EvidenceGateCalibrationTest（env 门控），调距离类型需重新标定
    evidence-gate-min-score: 0.5

  # ---- 积分制度（2026-10-11）----
  # 对话按意图差异化计费：普通对话 50 / 行程规划 200，调用前原子预扣（余额不足拒绝）；
  # 新用户注册初始 500（v1 失败轮不退款，成本已在模型网关发生）
  points:
    chat-cost: 50
    planning-cost: 200
    initial-balance: 500

  # ---- 提示词按需加载（2026-10-11 P2-I）----
  # 主 Agent 规划按需段（行程规划流程/共享任务区间/规划委派规则，~45% 篇幅）仅 PLANNING 轮发送；
  # false 回退全量常驻
  prompt-masking:
    enabled: true

  # ---- 意图三层级联配置（FR-S01）----  # L0 会话延续（Redis 30min）→ L1 规则表 → L2 deepseek-v4-flash-0731 单标签 → L3 IntentClassifier 兜底
  # 上层命中即短路；规则表为空时代码内置同款默认规则
  intent-cascade:
    enabled: true
    l0-enabled: true
    l0-ttl-minutes: 30
    l0-max-message-length: 20
    l2-enabled: true
    l2-model: deepseek-v4-flash-0731
    l2-cache-enabled: true
    l2-cache-ttl-minutes: 60
    # 分类上下文注入（2026-09-29 失忆修复 Fix 4）：messages 表 + 记忆摘要构建上下文块
    # 随消息送 L2/L3 语义判定——「长春」这类对 intake 反问的裸名词短回答在语境下判
    # PLANNING，不再被判 CHAT 脱离规划流；带上下文时旁路 L2 全局文本缓存（防投毒）
    context-enabled: true
    # 上下文取最近几轮原文（1 轮 = 1 user + 1 assistant）
    context-rounds: 2
    context-max-chars-per-message: 200
    context-summary-max-chars: 600
    # L1 规则表（按序首个命中生效；规划类自然语言刻意不进 L1，交由 L2/L3 语义判定）
    l1-rules:
      - pattern: "^(你好|您好|嗨|哈喽|hi|hello|在吗)[?？!！。~～\\s]*$"
        intent: CHAT
      - pattern: "^/规划"
        intent: PLANNING
      - pattern: "^/天气"
        intent: TOOL_CALL
      - pattern: "(查询|查一下|查查).{0,12}(火车票|高铁票|动车票|车票|机票|航班)"
        intent: TOOL_CALL
      - pattern: "(今天|明天|后天|大后天|周末).{0,8}(天气|气温|温度)"
        intent: TOOL_CALL

  # ---- LLM Gateway 配置（FR-S09：限流/熔断/快慢泳道/降级）----
  # 对话准入层（ChatService→LlmGateway）：全局并发 + 单用户并发 2 + 全局 QPS
  # 【容量基线（2026-09-23 并发改造）】：单机 8C16G 安全上限约 200~300 并发对话；
  # global-concurrency 按「在线人数 × 10~15% 同时活跃」估算——2000 在线配 200~300。
  # 真实上限同时受模型网关与上游模型配额钳制，超出配额会触发熔断/fallback，按实际配额调整。
  # 叠加 LoadShedService 三级过载降级（GREEN/YELLOW/RED，见 service/LoadShedService）兜底。
  # 快泳道（CHAT/TOOL_CALL/RAG）25s / 慢泳道（PLANNING）420s 对话级超时
  # 模型调用层（LlmGatewayModel 装饰器）：熔断（窗口 10 次/失败率 50%/OPEN 10s）
  # + 单次调用超时 30s + 失败 fallback → deepseek-v4-flash-0731 + SSE error 兜底文案
  llm-gateway:
    enabled: true
    global-concurrency: 200
    per-user-concurrency: 2
    global-qps: 100
    acquire-timeout-ms: 3000
    fast-lane-timeout-seconds: 25
    # 慢泳道 600s（2026-10-05 模型网关迁移后由 420 再上调）：glm-5-3-260814
    # （thinking 禁用）+ RAG 语义路降级（DashScope embedding 欠费）实测全链 450s
    # 仍未到质检段，600s 为框架 spawn 同步等待 clamp 上限——泳道必须 ≥ 同步等待上限。
    # qwen 时期为 300→420；FR-S09 容量假设（2000 在线）待 B4 回归复核
    slow-lane-timeout-seconds: 600
    model-timeout-seconds: 30
    # 首包探测超时（2026-10-11 P2-G）：首个 token 的到达判据——挂死 10s 快速失败切 fallback；
    # 首包到达后恢复 model-timeout-seconds 的间隙保护（区分「模型坏了」与「慢慢生成长行程」）
    first-packet-timeout-seconds: 10
    cb-sliding-window-size: 10
    cb-failure-rate-threshold: 50
    cb-minimum-number-of-calls: 5
    cb-wait-duration-open-seconds: 10
    fallback-enabled: true
    # 探测回切间隔（2026-10-11 熔断统计漂移修复）：粘滞 fallback 期间每 30s 对主模型
    # 发一次最小探测（走熔断器，OPEN 未到期零网络开销），成功即自动回切——替代重启恢复
    probe-interval-seconds: 30

  # ---- 过载降级配置（2026-09-23 并发改造：弹性降级优先策略）----
  # 三级：GREEN 正常 → YELLOW（堆>75% 或网关剩余<10%）：拒绝新 PLANNING，快请求正常
  #      → RED（堆>90% 或网关耗尽）：所有新对话拒绝，进行中的不中断
  load-shed:
    enabled: true
    heap-yellow-threshold: 0.75
    heap-red-threshold: 0.90
    permits-yellow-ratio: 0.10

  # ---- 对话历史注入 + 记忆摘要（2026-09-29 失忆修复）----
  # 每轮发给模型 = 记忆摘要块（conversations.summary，每满 10 轮后台增量折叠一次）
  #               + 最近 10 轮 messages 历史（每条截 400 字）+ 本轮用户消息
  # 修复前：只注入最近 3 轮，第 4 轮以前的内容模型彻底看不到（数据在库里但没喂给模型）
  chat-history:
    enabled: true
    # 滑动窗口：最近 N 轮（1 轮 = 1 user + 1 assistant）原文注入
    rounds: 10
    max-chars-per-message: 400
    # 滚动记忆摘要：窗口外的更早轮次折叠成摘要长期携带
    summary:
      enabled: true
      # 每满 10 轮（消息数差 ≥ 20）后台异步折叠一次
      interval-rounds: 10
      # 摘要存储/注入最大长度（字符）
      max-chars: 1500
      # 折叠输入单条截断 / 总量上限（超出按比例收紧单条）
      input-max-chars-per-message: 600
      input-total-max-chars: 30000
      # 摘要生成模型（每 10 轮一次的低成本辅助调用，模型网关轻量档，与 L2 意图分类同级定位）
      model: deepseek-v4-flash-0731
      timeout-seconds: 30

# ======================== 日志配置 ========================
logging:
  level:
    root: INFO
    com.travelscope: DEBUG
    io.agentscope: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    # [%X{traceId:-},%X{spanId:-}]：链路追踪关联字段（MDC 由 micrometer-tracing 自动填充，
    # Jaeger UI 里的 traceId 可直接在日志中搜索；无 trace 上下文时输出 [,]）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{50} - %msg%n"
  file:
    name: logs/travelscope.log
    max-size: 50MB
    max-history: 30

# ======================== Actuator 端点配置 ========================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, env
  endpoint:
    health:
      show-details: always
  # ---- Micrometer Tracing 链路追踪（2026-09-29 接入，导出到 Jaeger）----
  tracing:
    sampling:
      # 采样率：开发期全采样（每个请求/定时任务都生成 Trace）；生产建议 0.1 以下
      probability: 1.0
  otlp:
    tracing:
      # OTLP HTTP 导出端点（docker-compose 的 travelscope-jaeger 容器，4318）
      endpoint: http://localhost:4318/v1/traces
  health:
    # ES 健康指示器禁用：Boot 3.3.5 actuator 与 ES Java 客户端 9.0.2 方法签名不兼容
    # （HealthResponse.activeShardsPercentAsNumber 抛 NoSuchMethodError，且反应式流挂起
    #  拖死整个 /actuator/health 聚合响应）；ES 状态由 docker healthcheck + 直连 9200 兜底
    elasticsearch:
      enabled: false
